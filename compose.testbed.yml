name: agent-security-testbed

services:
  victim-model:
    image: ollama/ollama:0.21.2
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: "1"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - victim-models:/root/.ollama
    networks: [testbed]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 8g
    cpus: 6.0

  model-loader:
    image: ollama/ollama:0.21.2
    profiles: [setup]
    environment:
      OLLAMA_HOST: http://victim-model:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${VICTIM_MODEL:-qwen2.5:3b}"]
    depends_on:
      victim-model:
        condition: service_healthy
    networks: [testbed]
    security_opt: [no-new-privileges:true]

  agentdojo:
    build:
      context: ./testbed/agentdojo
      args:
        AGENTDOJO_VERSION: ${AGENTDOJO_VERSION:-0.1.35}
    restart: unless-stopped
    command: ["sleep", "infinity"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: /tmp
      OPENAI_COMPATIBLE_BASE_URL: http://victim-model:11434/v1
      OPENAI_COMPATIBLE_API_KEY: ollama
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      VICTIM_MODEL: ${VICTIM_MODEL:-qwen2.5:3b}
    volumes:
      - ./testbed/runs:/workspace/runs
      - ./testbed/custom_attacks:/workspace/custom_attacks:ro
    depends_on:
      victim-model:
        condition: service_healthy
    networks: [testbed]
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0

networks:
  testbed:
    driver: bridge

volumes:
  victim-models:
