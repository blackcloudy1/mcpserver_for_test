# Preferred on this Windows host: reuse the installed Ollama service.
services:
  victim-model:
    profiles: [container-model]

  model-loader:
    profiles: [container-model-setup]

  agentdojo:
    depends_on: !reset {}
    command: ["python", "/opt/agentdojo/tcp_forward.py"]
    environment:
      LOCAL_LLM_PORT: "8000"
      OLLAMA_TARGET_HOST: host.docker.internal
      OLLAMA_TARGET_PORT: "11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./testbed/agentdojo/tcp_forward.py:/opt/agentdojo/tcp_forward.py:ro
