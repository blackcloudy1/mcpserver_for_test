# Add the external MCP network and MCP-aware victim Agent image.
services:
  agentdojo:
    build:
      context: ./testbed/agentdojo
      dockerfile: Dockerfile.mcp
    environment:
      DOCS_MCP_URL: http://docs-mcp:9101/mcp
      SALES_MCP_URL: http://sales-mcp:9102/mcp
      REPORT_MCP_URL: http://report-mcp:9103/mcp
      MCP_API_TOKEN: ${MCP_API_TOKEN:-lab-token}
      OPENAI_BASE_URL: http://127.0.0.1:8000/v1
      NO_PROXY: docs-mcp,sales-mcp,report-mcp,127.0.0.1,localhost,host.docker.internal
      no_proxy: docs-mcp,sales-mcp,report-mcp,127.0.0.1,localhost,host.docker.internal
    networks:
      - testbed
      - mcp-tools

networks:
  mcp-tools:
    external: true
    name: agent-security-lab_lab-net

