name: agent-security-lab

x-mcp-env: &mcp-env
  MCP_HOST: 0.0.0.0
  MCP_DATA_DIR: /app/data
  MCP_API_TOKEN: ${MCP_API_TOKEN:-lab-token}

x-mcp-common: &mcp-common
  build:
    context: .
  restart: unless-stopped
  networks: [lab-net]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 128
  mem_limit: 256m
  cpus: 0.50

services:
  docs-mcp:
    <<: *mcp-common
    command: ["node", "dist/servers/docs-server.js"]
    environment:
      <<: *mcp-env
      PORT: "9101"
    ports: ["127.0.0.1:9101:9101"]
    volumes:
      - ./data/docs:/app/data/docs:ro

  sales-mcp:
    <<: *mcp-common
    command: ["node", "dist/servers/sales-server.js"]
    environment:
      <<: *mcp-env
      PORT: "9102"
    ports: ["127.0.0.1:9102:9102"]
    volumes:
      - ./data/sales:/app/data/sales:ro
      - ./data/orders:/app/data/orders:ro

  report-mcp:
    <<: *mcp-common
    command: ["node", "dist/servers/report-server.js"]
    environment:
      <<: *mcp-env
      PORT: "9103"
    ports: ["127.0.0.1:9103:9103"]
    volumes:
      - ./data/reports:/app/data/reports

  opa:
    image: openpolicyagent/opa:1.17.0-static
    restart: unless-stopped
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=info", "/policies"]
    ports: ["127.0.0.1:8181:8181"]
    volumes:
      - ./policy:/policies:ro
    networks: [lab-net]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25

  security-lab:
    build:
      context: ./lab
    restart: unless-stopped
    command: ["uvicorn", "security_lab.app:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      OPA_URL: http://opa:8181/v1/data/agent_security/decision
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [opa]
    networks: [lab-net]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.75

  mock-egress:
    build:
      context: ./lab
    restart: unless-stopped
    command: ["uvicorn", "security_lab.mock_egress:app", "--host", "0.0.0.0", "--port", "9199"]
    ports: ["127.0.0.1:9199:9199"]
    networks: [lab-net]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25

  phoenix:
    image: arizephoenix/phoenix:latest
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6006:6006"
      - "127.0.0.1:4317:4317"
    volumes:
      - phoenix-data:/mnt/data
    networks: [lab-net]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g

networks:
  lab-net:
    internal: true

volumes:
  phoenix-data:
