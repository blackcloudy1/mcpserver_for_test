servers:
  - server_id: business_docs
    transport: streamable_http
    url: http://192.168.1.100:9101/mcp
    trust_level: remote_untrusted
    allowed_host: 192.168.1.100
    allowed_port: 9101
    allowed_tools: [search_docs, read_doc]
    required_scope: docs:read
    result_policy: prompt_injection_scan

  - server_id: business_sales
    transport: streamable_http
    url: http://192.168.1.100:9102/mcp
    trust_level: remote_untrusted
    allowed_host: 192.168.1.100
    allowed_port: 9102
    tool_policies:
      get_sales_summary: { required_scope: sales:read, decision: allow }
      get_top_regions: { required_scope: sales:read, decision: allow }
      get_customer_orders: { required_scope: sales:customer:read, decision: block_by_default }

  - server_id: business_report
    transport: streamable_http
    url: http://192.168.1.100:9103/mcp
    trust_level: remote_untrusted
    allowed_host: 192.168.1.100
    allowed_port: 9103
    tool_policies:
      save_report: { required_scope: report:write, decision: confirm }
      list_reports: { required_scope: report:read, decision: allow }
      read_report: { required_scope: report:read, decision: allow }

# Load the bearer token from an environment variable in the gateway.
bearer_token_env_var: BUSINESS_MCP_TOKEN
